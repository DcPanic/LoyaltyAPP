# Publishes the clickable preview in docs/demo to GitHub Pages.
# The preview is static sample data — the real platform needs the API and a
# database, which Pages cannot host.
name: Preview site

on:
  push:
    branches: [main, 'claude/**']
    paths:
      - 'docs/demo/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Turns Pages on for the repository if it is not enabled yet.
          enablement: true

      - name: Upload preview
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/demo

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
