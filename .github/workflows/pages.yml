# Publishes the clickable preview in docs/demo to GitHub Pages.
#
# Manual on purpose: GitHub Pages needs a paid plan on a private repository,
# and Pages has to be switched on once under Settings -> Pages -> Source:
# GitHub Actions before this can deploy. Run it from the Actions tab when you
# want the preview published.
#
# The preview is static sample data — the real platform needs the API and a
# database, which Pages cannot host. `docs/demo/index.html` also opens straight
# from disk in a browser.
name: Preview site

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Turns Pages on for the repository if it is not enabled yet.
          enablement: true

      - name: Upload preview
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/demo

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
