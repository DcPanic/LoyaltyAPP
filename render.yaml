# One-click hosting: Render reads this file and creates the API and the web app,
# already wired to each other.
#
#   Render dashboard -> New -> Blueprint -> pick this repository -> Apply
#
# The database is deliberately NOT created here. Render's free database is
# deleted after 30 days; a free Neon project (neon.tech) is not. Paste the Neon
# connection string into DATABASE_URL when Render asks, and nothing you enter
# ever expires.
#
# Free Render services sleep after 15 minutes without traffic and take about a
# minute to wake. That is fine while you are trying the platform and wrong for a
# real café — change `plan: free` to `plan: starter` when customers depend on it.

services:
  # ---------------------------------------------------------------- API ----
  - type: web
    name: loyaltyapp-api
    runtime: node
    region: frankfurt
    plan: free
    buildCommand: npm ci && npm run build -w @loyaltyapp/shared && npm run build -w @loyaltyapp/api
    # Migrations run before the server starts, so a schema change deploys itself.
    startCommand: npm run db:deploy -w @loyaltyapp/api && npm start -w @loyaltyapp/api
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      # Paste your Neon connection string here when Render asks for it.
      - key: DATABASE_URL
        sync: false
      # Generated once by Render and never shown in the repository: it signs
      # every staff session and every customer's member token.
      - key: JWT_SECRET
        generateValue: true
      # The API takes its own public address from RENDER_EXTERNAL_URL and learns
      # the web app's address from here, so no URLs need pasting back in.
      - key: APP_HOST
        fromService:
          type: web
          name: loyaltyapp-web
          property: host
      - key: LOG_LEVEL
        value: info
      # Wallet credentials — leave empty until you have them from Apple and
      # Google. Everything else works without them (see docs/WALLET.md).
      - key: APPLE_PASS_TYPE_IDENTIFIER
        sync: false
      - key: APPLE_TEAM_IDENTIFIER
        sync: false
      - key: APPLE_PASS_CERT_PEM
        sync: false
      - key: APPLE_PASS_KEY_PEM
        sync: false
      - key: APPLE_WWDR_CERT_PEM
        sync: false
      - key: GOOGLE_WALLET_ISSUER_ID
        sync: false
      - key: GOOGLE_WALLET_SA_EMAIL
        sync: false
      - key: GOOGLE_WALLET_SA_PRIVATE_KEY
        sync: false

  # ------------------------------------------------------------- web app ----
  - type: web
    name: loyaltyapp-web
    runtime: node
    region: frankfurt
    plan: free
    buildCommand: npm ci && npm run build -w @loyaltyapp/shared && npm run build -w @loyaltyapp/web
    startCommand: npm start -w @loyaltyapp/web
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_HOST
        fromService:
          type: web
          name: loyaltyapp-api
          property: host
